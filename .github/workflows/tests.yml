name: Tests

on:
  pull_request:
    paths:
      - 'zoho-survey/scripts/**'
      - 'zoho-survey/shared/js/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'
  push:
    branches:
      - main
    paths:
      - 'zoho-survey/scripts/**'
      - 'zoho-survey/shared/js/**'
      - 'tests/**'
      - 'requirements.txt'
      - '.github/workflows/tests.yml'

jobs:
  python-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-models-${{ hashFiles('zoho-survey/scripts/lib/nlp.py', 'zoho-survey/scripts/lib/aspect_extraction.py', 'zoho-survey/scripts/lib/sentiment_engine.py') }}
          restore-keys: |
            ${{ runner.os }}-hf-models-

      - name: Cache spaCy models
        uses: actions/cache@v4
        with:
          path: ~/.cache/spacy
          key: ${{ runner.os }}-spacy-es_core_news_sm
          restore-keys: |
            ${{ runner.os }}-spacy-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download es_core_news_sm

      - name: Run Python tests (unittest)
        working-directory: zoho-survey/scripts
        run: python -m unittest discover tests/ -v

      - name: Validate JSON contracts (schema Draft-07 + invariantes)
        run: python zoho-survey/scripts/validate_generated_json.py

  js-tests:
    name: JavaScript unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Verify JS syntax (all modules)
        run: |
          for f in zoho-survey/shared/js/config/*.js \
                   zoho-survey/shared/js/utils/*.js \
                   zoho-survey/shared/js/components/*.js \
                   zoho-survey/shared/js/dashboard.js \
                   zoho-survey/shared/js/loader.js \
                   tests/test-framework.js \
                   tests/unit/*.js; do
            node -c "$f" || exit 1
          done
          echo "✓ Todos los archivos JS pasaron verificación de sintaxis"

      - name: Run JS unit tests (Node)
        run: |
          node -e "
          global.window = {};
          global.document = {
            getElementById: () => null,
            querySelectorAll: () => [],
            addEventListener: () => {},
            createElement: () => ({ style:{}, classList:{add:()=>{}}, setAttribute:()=>{}, appendChild:()=>{} }),
          };
          require('./zoho-survey/shared/js/config/constants.js');
          require('./zoho-survey/shared/js/utils/formatters.js');
          require('./zoho-survey/shared/js/utils/sanitizer.js');
          require('./tests/test-framework.js');
          require('./tests/unit/test-config.js');
          require('./tests/unit/test-formatters.js');
          require('./tests/unit/test-sanitizer.js');
          const r = window.TestFramework.summary();
          console.log('Tests: ' + r.passed + ' passed, ' + r.failed + ' failed, ' + r.total + ' total');
          if (r.failed > 0) {
            r.results.filter(x => x.type === 'fail').forEach(t => console.log('FAIL: ' + t.name + ' -> ' + t.error));
            process.exit(1);
          }
          console.log('✓ Todos los tests JS pasaron');
          "
