name: Deploy Legacy Static Site

on:
  push:
    branches: [main]
    paths:
      - 'zoho-survey/**'
  workflow_dispatch:

concurrency:
  group: deploy-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Legacy Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact (zoho-survey)
        uses: actions/upload-pages-artifact@v3
        with:
          path: './zoho-survey'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
