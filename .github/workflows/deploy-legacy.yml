name: Deploy Legacy Static Site

on:
  push:
    branches: [main]
    paths:
      - 'zoho-survey/**'
      - 'index.html'
  workflow_dispatch:

concurrency:
  group: deploy-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy Legacy Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact (root)
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
