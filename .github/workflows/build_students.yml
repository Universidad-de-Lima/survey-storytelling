name: Build and Deploy Survey

on:
  push:
    paths:
      # Solo disparar cuando cambien cosas que requieran re-build.
      # NO disparar por JSON generados (zoho-survey/students/*/json/**)
      # ni por los index.html generados (zoho-survey/students/*/index.html).
      - 'data/**'
      - 'zoho-survey/scripts/**'
      - 'zoho-survey/template/**'
      - 'zoho-survey/shared/**'
      - 'zoho-survey/students/*/periodos.json'
      - 'zoho-survey/**/periodos.json'
      - 'requirements.txt'
      - '.github/workflows/build_students.yml'

  workflow_dispatch:

concurrency:
  # Cancela runs anteriores en la misma rama si un nuevo push llega.
  # Esto reduce carreras: si haces 2 pushes seguidos, solo el último completa.
  group: deploy-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v7
        # fetch-depth: 0 trae todo el historial, necesario para que
        # `git pull --rebase` en el step de commit funcione cuando el
        # remote tiene commits que el runner no conoce.
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache Hugging Face models
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-models-${{ hashFiles('zoho-survey/scripts/lib/nlp.py', 'zoho-survey/scripts/lib/aspect_extraction.py', 'zoho-survey/scripts/lib/sentiment_engine.py') }}
          restore-keys: |
            ${{ runner.os }}-hf-models-

      - name: Cache IA Cualitativo (DeepSeek)
        # Caché persistente de resultados IA por hash(comentario + contexto).
        # Evita re-llamar a la API en builds subsiguientes si el CSV no cambió.
        uses: actions/cache@v6
        with:
          path: zoho-survey/scripts/ia_cache.json
          key: ia-cache-${{ hashFiles('data/**', 'zoho-survey/scripts/lib/prompts_cualitativo.py') }}
          restore-keys: |
            ia-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download es_core_news_sm

      - name: Run build_json.py
        # DEEPSEEK_API_KEY se inyecta desde GitHub Secrets.
        # Si no está definida, el pipeline cae automáticamente al modo legacy
        # (spaCy + sentence-transformers) sin fallo.
        #
        # Variables IA_CUALITATIVO_* controlan el comportamiento del motor IA:
        #   WORKERS=15    → 15 llamadas concurrentes a DeepSeek (speedup ~15x)
        #   MAX_RPM=60    → rate limit global (DeepSeek permite ~60 RPM)
        #   TIMEOUT=60    → timeout por llamada individual (segundos)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          IA_CUALITATIVO_WORKERS: "15"
          IA_CUALITATIVO_MAX_RPM: "60"
          IA_CUALITATIVO_TIMEOUT: "60"
        run: |
          python zoho-survey/scripts/build_json.py

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact (zoho-survey)
        uses: actions/upload-pages-artifact@v5
        with:
          path: './zoho-survey'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Commit generated JSON
        # Commit robusto: integra cambios remotos con rebase antes de push.
        # [skip ci] evita que el commit del bot dispare un nuevo run del workflow
        # (defensa en profundidad, aunque GITHUB_TOKEN ya no auto-dispara).
        #
        # NOTA: este push ocurre DESPUÉS del deploy a Pages para que el cambio
        # en la rama main no interfiera con el artifact desplegado por Actions.
        run: |
          git config --global user.name "survey-bot"
          git config --global user.email "survey-bot@users.noreply.github.com"

          git add zoho-survey/
          git add data/

          # Salir limpio si no hay cambios (evita commit vacío)
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Auto update survey json [skip ci]"

          # Integrar cambios remotos con rebase antes de push.
          # Reintenta hasta 3 veces si hay conflictos de JSON (poco probables
          # porque el bot es el único que toca esos archivos).
          for i in 1 2 3; do
            if git pull --rebase origin main; then
              break
            else
              echo "Rebase fallido, intento $i/3. Resolviendo conflictos..."
              # Si hay conflictos en JSON generados, preferir nuestra versión
              # (la del bot, que es la más reciente del build actual).
              git checkout --theirs zoho-survey/ data/ 2>/dev/null || true
              git add zoho-survey/ data/
              git rebase --continue || break
            fi
            sleep 2
          done

          git push origin HEAD:main
