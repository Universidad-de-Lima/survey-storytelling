name: Build Survey JSON

on:
  push:
    paths:
      - 'data/**'
      - 'zoho-survey/students/scripts/**'

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas

      - name: Run build_json.py
        working-directory: zoho-survey/students
        run: |
          python scripts/build_json.py

      - name: Commit generated JSON
        run: |
          git config --global user.name "survey-bot"
          git config --global user.email "survey-bot@users.noreply.github.com"

          git add zoho-survey/
          git add data/

          git commit -m "Auto update survey json" || echo "No changes"

          git push
