name: Build and Deploy Survey

on:
  push:
    paths:
      - 'data/**'
      - 'zoho-survey/**'

  workflow_dispatch:

concurrency:
  group: deploy-legacy-${{ github.ref }}
  cancel-in-progress: true

jobs:

  build-and-deploy:

    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Cache Hugging Face models
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-models-${{ hashFiles('zoho-survey/scripts/lib/nlp.py') }}
          restore-keys: |
            ${{ runner.os }}-hf-models-

      - name: Cache IA Cualitativo (DeepSeek)
        # Caché persistente de resultados IA por hash(comentario + contexto).
        # Evita re-llamar a la API en builds subsiguientes si el CSV no cambió.
        uses: actions/cache@v4
        with:
          path: zoho-survey/scripts/ia_cache.json
          key: ia-cache-${{ hashFiles('data/**') }}
          restore-keys: |
            ia-cache-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m spacy download es_core_news_sm

      - name: Run build_json.py
        # DEEPSEEK_API_KEY se inyecta desde GitHub Secrets.
        # Si no está definida, el pipeline cae automáticamente al modo legacy
        # (spaCy + sentence-transformers) sin fallo.
        #
        # Variables IA_CUALITATIVO_* controlan el comportamiento del motor IA:
        #   WORKERS=15    → 15 llamadas concurrentes a DeepSeek (speedup ~15x)
        #   MAX_RPM=60    → rate limit global (DeepSeek permite ~60 RPM)
        #   TIMEOUT=60    → timeout por llamada individual (segundos)
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          IA_CUALITATIVO_WORKERS: "15"
          IA_CUALITATIVO_MAX_RPM: "60"
          IA_CUALITATIVO_TIMEOUT: "60"
        run: |
          python zoho-survey/scripts/build_json.py

      - name: Commit generated JSON
        run: |
          git config --global user.name "survey-bot"
          git config --global user.email "survey-bot@users.noreply.github.com"

          git add zoho-survey/
          git add data/

          git commit -m "Auto update survey json" || echo "No changes"

          git push

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact (zoho-survey)
        uses: actions/upload-pages-artifact@v5
        with:
          path: './zoho-survey'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
